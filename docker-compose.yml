# Полное окружение «Затеи»: приложение на RoadRunner, воркер очередей,
# PostgreSQL, Redis, RabbitMQ, Centrifugo и сборка фронтенда.
name: zateya

services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    env_file: .env
    environment:
      RUN_MIGRATIONS: "true"
      RUN_SEED: "true"
    ports:
      - "8080:8080"
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
      rabbitmq: { condition: service_healthy }
    restart: unless-stopped

  worker:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    command: php artisan queue:work --tries=3 --max-time=3600
    env_file: .env
    environment:
      RUN_MIGRATIONS: "false"
    depends_on:
      app: { condition: service_started }
    restart: unless-stopped

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: zateya
      POSTGRES_USER: zateya
      POSTGRES_PASSWORD: zateya
    volumes:
      - postgres-data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U zateya"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis-data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: zateya
      RABBITMQ_DEFAULT_PASS: zateya
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  centrifugo:
    image: centrifugo/centrifugo:v5
    command: centrifugo --config=/centrifugo/config.json
    volumes:
      - ./docker/centrifugo/config.json:/centrifugo/config.json:ro
    ports:
      - "8000:8000"
    ulimits:
      nofile:
        soft: 65536
        hard: 65536

  frontend:
    image: node:22-alpine
    working_dir: /app/frontend
    command: sh -c "npm ci && npm run build && npx --yes serve -s dist -l 5173"
    volumes:
      - ./frontend:/app/frontend
    environment:
      VITE_API_BASE: http://localhost:8080/api/v1
      VITE_API_MOCK: "false"
      VITE_CENTRIFUGO_URL: ws://localhost:8000/connection/websocket
    ports:
      - "5173:5173"
    depends_on:
      app: { condition: service_started }

volumes:
  postgres-data:
  redis-data:
